name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # The same engine tests against a real Postgres server, as on Neon, instead of in-process PGlite.
      - name: Test against Postgres
        run: bun run --filter '@relay/server' test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Lint
        run: bun run --filter '@relay/web' lint

      - name: Build the dashboard
        run: bun run --filter '@relay/web' build

      - name: Install browser for end-to-end tests
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Test browser workflows
        working-directory: web
        run: bun run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          retention-days: 7

      - name: Audit dependencies
        run: bun audit --production && bun audit --audit-level=high
